name: fieldops_mobile
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
    
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  dio: ^5.11.1
  get_it: ^9.3.0
  connectivity_plus: ^7.3.2
  geolocator: ^14.0.1
  permission_handler: ^12.0.1
  uuid: ^4.6.0
  drift: ^2.34.0
  # drift_flutter and sqlite3_flutter_libs temporarily removed during code gen
  # (their native build hooks block build_runner). Restored after generation.
  # drift_flutter: ^0.3.1
  # sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.0
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  intl: ^0.20.2
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  mocktail: ^1.0.4


# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/bsf.jpg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

